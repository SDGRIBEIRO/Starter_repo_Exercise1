name: CI

on: #trigger
  
  #workflow_dispatch: #manual button to run this workflow
  
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
  
  push:
    branches:
      - main
    paths:
      - 'src/**'
    #  - 'src/*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 #use the latest Github checkout for files in the repo
      
      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"
      
      - name: Show environment
        run: |
          echo "We are running Exercise 3" # print something
          uname -a # name of the operating system
          pwd #print the working directory / folder

      - name: Run tests
        run: echo "Tests passed"
        #run: exit 1
      
      - name: List files
        run: ls -la
      
      # Prints the contents of src/index.html to the workflow log
      - name: list contents of index.html
        run: cat src/index.html

  #lint:
   # runs-on: ubuntu-latest

    #steps:
     # - uses: actions/checkout@v7

      #- name: Show trigger
       # run: echo "Triggered by ${{ github.event_name }}"

      #- name: Run lint
       # run: echo "Lint passed"


  build:
    needs: 
      - test
      #- lint
  
    permissions:
      contents: read
      packages: write  
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build application
        run: |
          mkdir -p dist
          cp src/index.html dist/index.html

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7
  
  deploy-demo:
    needs: build
    
    permissions:
      contents: read
    
    runs-on: ubuntu-latest  

    env:
      REGION: ${{ vars.DEPLOY_REGION }}
  
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: ./dist
  
      - name: Show deployment configuration
        run: echo "Deploying to $REGION"
  
      - name: Inspect build output
        run: |
          ls -R dist
          cat dist/index.html

      - name: Verify deployment token
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "A deployment token was provided"
          test -n "$TOKEN"
  
      - name: Deploy
        run: echo "Deploying application"
